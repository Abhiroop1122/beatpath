<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Beatpath: learn music theory and melody, then make it in FL Studio">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset=".55" stop-color="#c9ecff"/><stop offset="1" stop-color="#eefaff"/></linearGradient>
  <radialGradient id="bubFill" cx=".5" cy=".5" r=".5"><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></radialGradient>
  <linearGradient id="eqFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9be15a"/><stop offset="1" stop-color="#2f8f1c"/></linearGradient>
  <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity=".55"/></linearGradient>
  <filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="4" in="SourceAlpha" result="b"/><feFlood flood-color="#ffffff" flood-opacity=".9"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
</defs>
<style>
  .bub { animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes rise { from { transform: translateY(0) translateX(0); } 50% { transform: translateY(-260px) translateX(14px); } to { transform: translateY(-540px) translateX(0); } }
  .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 4.5s ease-out infinite; }
  @keyframes ripple { from { transform: scale(.35); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
  .lou { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translate(880px,150px) rotate(-2deg); } 50% { transform: translate(880px,132px) rotate(2deg); } }
  .eq { transform-box: fill-box; transform-origin: bottom; animation-name: eq; animation-iteration-count: infinite; animation-direction: alternate; animation-timing-function: ease-in-out; }
  @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
  .note { font: 700 34px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0a548f; opacity: 0; animation: float 5.2s ease-out infinite; }
  @keyframes float { 0% { opacity: 0; transform: translate(0,0) rotate(0); } 15% { opacity: .9; } 100% { opacity: 0; transform: translate(40px,-120px) rotate(18deg); } }
  .title { font: 800 96px -apple-system, "Segoe UI", Roboto, "Open Sans", sans-serif; fill: #083f70; letter-spacing: -2px; }
  .sub { font: 600 26px -apple-system, "Segoe UI", Roboto, "Open Sans", sans-serif; fill: #1e4f78; }
  .chipt { font: 700 18px -apple-system, "Segoe UI", Roboto, "Open Sans", sans-serif; fill: #0a548f; }
  .shine { animation: shine 6s ease-in-out infinite; }
  @keyframes shine { 0%,60% { transform: translateX(-400px); } 100% { transform: translateX(1400px); } }
</style>
